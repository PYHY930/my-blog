<script>
document.addEventListener("DOMContentLoaded", function() {
    const chatBtn = document.getElementById('ai-chat-button');
    const chatWindow = document.getElementById('ai-chat-window');
    const closeBtn = document.getElementById('ai-close-btn');
    const sendBtn = document.getElementById('ai-send-btn');
    const input = document.getElementById('ai-chat-input');
    const messagesBox = document.getElementById('ai-chat-messages');

    
    const WORKER_URL = "https://ai-proxy.253631510.workers.dev"; 

    
    let chatHistory = [
        { role: "system", content: "你是彭杨浩宇的个人博客助手。你的性格幽默、热情、懂技术。回答要简洁明了，不要长篇大论。" }
    ];

    
    chatBtn.onclick = () => {
        chatWindow.style.display = 'flex';
    };
    closeBtn.onclick = () => chatWindow.style.display = 'none';

    
    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        
        messagesBox.innerHTML += `<div style="text-align: right; margin-bottom: 10px;"><span style="background: #007bff; padding: 10px; border-radius: 8px; display: inline-block; color: white;">${text}</span></div>`;
        input.value = '';
        chatHistory.push({ role: "user", content: text });

        
        const loadingId = 'loading-' + Date.now();
        messagesBox.innerHTML += `<div id="${loadingId}" style="margin-bottom: 10px; color: #888;">(｡･ω･｡) 正在思考...</div>`;
        messagesBox.scrollTop = messagesBox.scrollHeight;

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory })
            });
            const data = await res.json();
            const aiReply = data.choices[0].message.content;
            
            
            document.getElementById(loadingId).remove();
            messagesBox.innerHTML += `<div style="margin-bottom: 10px;"><span style="background: #333; padding: 10px; border-radius: 8px; display: inline-block;">${aiReply}</span></div>`;
            chatHistory.push({ role: "assistant", content: aiReply });
        } catch (e) {
            document.getElementById(loadingId).innerText = "网络出小差了，请稍后再试...";
        }
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    sendBtn.onclick = sendMessage;
    input.addEventListener("keypress", function(event) {
        if (event.key === "Enter") sendMessage();
    });
});

<script>
    let menu = document.getElementById('menu');

        if (scrollPosition) {
            menu.scrollLeft = parseInt(scrollPosition, 10);
        }
        
        menu.onscroll = function () {
            localStorage.setItem("menu-scroll-position", menu.scrollLeft);
        }
    }

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener("click", function (e) {
            e.preventDefault();
            var id = this.getAttribute("href").substr(1);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView({
                    behavior: "smooth"
                });
            } else {
                document.querySelector(`[id='${decodeURIComponent(id)}']`).scrollIntoView();
            }
            if (id === "top") {
                history.replaceState(null, null, " ");
            } else {
                history.pushState(null, null, `#${id}`);
            }
        });
    });

</script>
<script>

        const scrollThreshold = window.innerHeight;
        if (document.body.scrollTop > scrollThreshold || document.documentElement.scrollTop > scrollThreshold) {
            toplink.classList.remove("hidden");
        } else {
            toplink.classList.add("hidden");
        }
    };

</script>
