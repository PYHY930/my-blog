baseURL = "https://pkthomas.dpdns.org/"
languageCode = "zh-cn"
title = "-phX-"
theme = "PaperMod"

# 开启基础功能
[params]
    #开启图标
    customCSS = ["css/custom.css"]
    author = "你的名字"
    description = "记录我的技术与生活"
    ShowReadingTime = true       
    ShowShareButtons = true      
    ShowCodeCopyButtons = true   
    ShowBreadCrumbs = true       
    ShowPostNavLinks = true      
    
    # 首页个人卡片
    [params.homeInfoParams]
        
    # 开启搜索
    ShowSearch = true
    
# 社交图标
#[[params.socialIcons]]
#    name = "github"
#    url = "https://github.com/你的GitHub用户名"

#[[params.socialIcons]]
#    name = "mail"
#   url = "mailto:你的邮箱@example.com"

# 导航栏菜单
[[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10

[[menu.main]]
    identifier = "music"
    name = "音乐"
    url = "/music/"
    weight = 20

[[menu.main]]
    identifier = "games"
    name = "游戏"
    url = "/games/"
    weight = 30
[[menu.main]]
    identifier = "study"
    name = "资料"
    url = "/study/"
    weight = 40 
# 搜索功能的输出格式
[outputs]
    home = ["HTML", "RSS", "JSON"]
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true